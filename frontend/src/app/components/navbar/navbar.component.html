<header class="topbar">
  <div class="brand">
    <a routerLink="/dashboard" class="logo-link" title="OrbNOC">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" class="logo-svg">
        <defs>
          <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FCD34D" />
            <stop offset="50%" stop-color="#FBBF24" />
            <stop offset="100%" stop-color="#F59E0B" />
          </linearGradient>
          <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.5" />
            <stop offset="100%" stop-color="#FBBF24" stop-opacity="0" />
          </radialGradient>
        </defs>
        <rect x="0" y="0" width="48" height="48" rx="10" fill="#111827" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
        <circle cx="24" cy="24" r="18" fill="url(#coreGlow)" />
        <circle cx="24" cy="24" r="14" fill="none" stroke="url(#ringGradient)" stroke-width="2.5"
                stroke-dasharray="66 22" stroke-linecap="round" transform="rotate(-45 24 24)"/>
        <circle cx="24" cy="24" r="4" fill="#FBBF24" />
        <circle cx="24" cy="24" r="2" fill="#FEF3C7" />
        <g class="orbit-dot">
          <circle cx="38" cy="24" r="3.5" fill="#10B981" opacity="0.3" />
          <circle cx="38" cy="24" r="2" fill="#10B981" />
        </g>
      </svg>
    </a>
    <span class="logo-text">OrbNOC</span>
    <div class="workspace-selector">
      <span class="env-dot"></span> Produção <span class="chevron">&#9662;</span>
    </div>
  </div>

  <nav class="menu">
    <a routerLink="/dashboard" routerLinkActive="active">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      Dashboard
    </a>
    <a routerLink="/devices" routerLinkActive="active">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>
      Dispositivos
    </a>
    <a routerLink="/incidents" routerLinkActive="active">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
      Incidentes
    </a>
  </nav>

  <div class="user-area">
    <button class="search-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      Buscar <kbd>Ctrl K</kbd>
    </button>
    <div class="avatar-wrapper">
      <div class="avatar-initials">AD</div>
      <span class="status-indicator-online"></span>
    </div>
  </div>
</header>
