<aside class="sidebar">
  <a routerLink="/dashboard" class="brand" aria-label="OrbNOC, ir para a visão geral">
    <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" class="logo-svg" aria-hidden="true">
      <defs>
        <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FCD34D" />
          <stop offset="50%" stop-color="#FBBF24" />
          <stop offset="100%" stop-color="#F59E0B" />
        </linearGradient>
      </defs>
      <rect x="0" y="0" width="48" height="48" rx="10" fill="#0A0F15" stroke="rgba(251,191,36,0.28)" stroke-width="1"/>
      <circle cx="24" cy="24" r="14" fill="none" stroke="url(#ringGradient)" stroke-width="2.5" stroke-dasharray="66 22" stroke-linecap="round" transform="rotate(-45 24 24)"/>
      <circle cx="24" cy="24" r="4" fill="#FBBF24" />
      <circle cx="24" cy="24" r="2" fill="#FEF3C7" />
      <g class="orbit-dot"><circle cx="38" cy="24" r="3.5" fill="#3DCC91" opacity="0.3"/><circle cx="38" cy="24" r="2" fill="#3DCC91"/></g>
    </svg>
    <span class="label brand-name">OrbNOC</span>
  </a>

  <button type="button" class="cmdk" (click)="openSearch()" aria-label="Buscar (Ctrl K)">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span class="label grow">Buscar</span>
    <kbd class="label">Ctrl K</kbd>
  </button>

  <nav class="nav" aria-label="Principal">
    <a routerLink="/dashboard" routerLinkActive="active" title="Visão geral">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      <span class="label">Visão geral</span>
    </a>
    <a routerLink="/topology" routerLinkActive="active" title="Topologia">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2.5"/><circle cx="12" cy="12" r="8"/><circle cx="12" cy="4" r="1.2" fill="currentColor"/><circle cx="19" cy="15.5" r="1.2" fill="currentColor"/></svg>
      <span class="label">Topologia</span>
    </a>
    <a routerLink="/devices" routerLinkActive="active" title="Dispositivos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><line x1="7" y1="7.5" x2="7.01" y2="7.5"/><line x1="7" y1="16.5" x2="7.01" y2="16.5"/></svg>
      <span class="label">Dispositivos</span>
    </a>
    <a routerLink="/incidents" routerLinkActive="active" title="Incidentes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 2.4 17.5A2 2 0 0 0 4.1 20.5h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9.5" x2="12" y2="13.5"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span class="label">Incidentes</span>
    </a>
    <a routerLink="/tools" routerLinkActive="active" title="Ferramentas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      <span class="label">Ferramentas</span>
    </a>
    <a routerLink="/audit" routerLinkActive="active" title="Auditoria">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><polyline points="14 3 14 8 19 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>
      <span class="label">Auditoria</span>
    </a>
  </nav>

  <div class="side-bottom">
    <a routerLink="/wallboard" class="tv" title="Modo TV">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span class="label">Modo TV</span>
    </a>

    <div class="env" title="Ambiente de produção"><span class="env-dot"></span><span class="label">Produção</span></div>

    <div class="profile">
      <button type="button" class="profile-btn" (click)="toggleProfile()" [attr.aria-expanded]="profileOpen" aria-haspopup="menu" aria-label="Menu da conta">
        <span class="avatar">{{ user?.username?.substring(0,2)?.toUpperCase() || 'AD' }}</span>
        <span class="who label">
          <strong>{{ user?.username || 'Usuário' }}</strong>
          <small>{{ user?.email || 'admin@orbnoc.local' }}</small>
        </span>
      </button>

      <div class="menu" role="menu" *ngIf="profileOpen">
        <div class="menu-head">
          <strong>{{ user?.username || 'Usuário' }}</strong>
          <span>{{ user?.email || 'admin@orbnoc.local' }}</span>
        </div>
        <button type="button" class="menu-item danger" role="menuitem" (click)="logout()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sair
        </button>
      </div>
    </div>
  </div>
</aside>

<div class="search-overlay" *ngIf="searchOpen" (click)="closeAll()">
  <div class="search-modal" role="dialog" aria-modal="true" aria-label="Busca global" (click)="$event.stopPropagation()">
    <div class="search-input-wrapper">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" #searchInput placeholder="Buscar por IP, hostname, incidente ou tela" aria-label="Buscar"
             [(ngModel)]="searchQuery" (ngModelChange)="onSearchChange()">
      <kbd>Esc</kbd>
    </div>

    <div class="search-results" *ngIf="searchResults.length > 0">
      <button type="button" class="result-item" *ngFor="let res of searchResults; let i = index"
              [class.active]="i === activeIndex" (mouseenter)="activeIndex = i" (click)="goTo(res.url)">
        <span class="result-icon" [attr.data-type]="res.type">
          <svg *ngIf="res.type === 'device'" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/></svg>
          <svg *ngIf="res.type === 'incident'" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 2.4 17.5A2 2 0 0 0 4.1 20.5h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9.5" x2="12" y2="13.5"/></svg>
          <svg *ngIf="res.type === 'page'" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </span>
        <span class="result-text">
          <span class="result-title">{{ res.title }}</span>
          <span class="result-meta">{{ res.meta }}</span>
        </span>
      </button>
    </div>

    <div class="search-empty" *ngIf="searchQuery && searchResults.length === 0">
      Nenhum resultado para “{{ searchQuery }}”. Tente um IP, hostname ou título de incidente.
    </div>
  </div>
</div>
