<header class="topbar">
  <div class="brand">
    <a routerLink="/dashboard" class="logo-link" title="OrbNOC">
      <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" class="logo-svg">
        <defs>
          <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FCD34D" />
            <stop offset="50%" stop-color="#FBBF24" />
            <stop offset="100%" stop-color="#F59E0B" />
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="48" height="48" rx="10" fill="#111827" stroke="rgba(251,191,36,0.25)" stroke-width="1"/>
        <circle cx="24" cy="24" r="14" fill="none" stroke="url(#ringGradient)" stroke-width="2.5" stroke-dasharray="66 22" stroke-linecap="round" transform="rotate(-45 24 24)"/>
        <circle cx="24" cy="24" r="4" fill="#FBBF24" />
        <circle cx="24" cy="24" r="2" fill="#FEF3C7" />
        <g class="orbit-dot"><circle cx="38" cy="24" r="3.5" fill="#10B981" opacity="0.3"/><circle cx="38" cy="24" r="2" fill="#10B981"/></g>
      </svg>
    </a>
    <span class="logo-text">OrbNOC</span>
    <div class="workspace-selector"><span class="env-dot"></span> Produção <span class="chevron">&#9662;</span></div>
  </div>
  <nav class="menu">
    <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
    <a routerLink="/topology" routerLinkActive="active">Topologia</a>
    <a routerLink="/devices" routerLinkActive="active">Dispositivos</a>
    <a routerLink="/incidents" routerLinkActive="active">Incidentes</a>
    <a routerLink="/tools" routerLinkActive="active">Ferramentas</a>
    <a routerLink="/audit" routerLinkActive="active">Auditoria</a>
  </nav>
  <div class="user-area">
    <button class="search-btn">Buscar <kbd>Ctrl K</kbd></button>
    <div class="avatar-wrapper"><div class="avatar-initials">AD</div><span class="status-indicator-online"></span></div>
  </div>
</header>
