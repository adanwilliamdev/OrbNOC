services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orbnoc
      POSTGRES_USER: orbnoc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbnoc -d orbnoc"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: jdbc:postgresql://db:5432/orbnoc
      DATABASE_USER: orbnoc
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      EXTRA_ORIGINS: ${EXTRA_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FORCE_RESET: ${ADMIN_FORCE_RESET:-false}
      ORBNOC_DEMO_SEED: ${ORBNOC_DEMO_SEED:-${SEED_DEMO_HOSTS:-false}}
      ALLOW_PRIVATE_NETWORKS: ${ALLOW_PRIVATE_NETWORKS:-true}
    # Permite ICMP sem privilégios (o ping do sistema usa socket de datagrama).
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"
    ports:
      - "127.0.0.1:8080:8080"

  # HTTPS automático (opcional): docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
