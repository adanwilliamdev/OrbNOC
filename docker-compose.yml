version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: biblioteca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: biblioteca
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: biblioteca
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: biblioteca-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # SQLAlchemy aceita tanto "postgresql://" quanto "postgresql+psycopg2://".
      DATABASE_URL: postgresql://biblioteca:biblioteca@postgres:5432/biblioteca
      PORT: 8080
      # Obrigatório: crie um arquivo ".env" na raiz do projeto (veja backend/.env.example)
      # com JWT_SECRET definido. Gere um valor com: openssl rand -base64 64
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no arquivo .env (veja backend/.env.example)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: biblioteca-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:8080"

volumes:
  postgres_data:
