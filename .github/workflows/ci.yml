name: CI

on:
  push:
    branches: [main]
  pull_request:
  # varredura semanal: vulnerabilidades novas aparecem mesmo sem mudança no código
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Formatação (Spotless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verificar formatação
        run: mvn -B spotless:check

  build:
    name: Build, testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # "verify" roda os testes unitários (surefire) e os de integração *IT (failsafe), que usam
      # PostgreSQL real via Testcontainers (o runner do GitHub já traz Docker), e depois o gate do
      # JaCoCo: o build falha se a cobertura de linhas ficar abaixo de jacoco.line.minimum (pom.xml).
      # A formatação tem job próprio, por isso é pulada aqui.
      - name: Compilar, testar e checar cobertura
        run: mvn -B verify -Dspotless.check.skip=true
      - name: Resumo da cobertura
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 { miss+=$8; cov+=$9 } END {
              printf "### Cobertura de linhas (JaCoCo)\n\n%.1f%% (%d de %d linhas)\n", 100*cov/(miss+cov), cov, miss+cov
            }' target/site/jacoco/jacoco.csv >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Anexar relatório de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-jacoco
          path: target/site/jacoco
          if-no-files-found: ignore
      - name: Anexar relatórios de teste (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports
            target/failsafe-reports

  security:
    name: Vulnerabilidades (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    # Fora dos PRs de forks (não têm acesso ao segredo) e sem atrasar o feedback dos PRs comuns.
    if: github.event_name != 'pull_request'
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Cache da base NVD
        if: env.NVD_API_KEY != ''
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      # Sem NVD_API_KEY a NVD limita tanto as consultas que a varredura costuma falhar; por isso só
      # roda quando o segredo existe (gere gratuitamente em https://nvd.nist.gov/developers/request-an-api-key).
      - name: Varrer dependências (falha com CVSS >= 7)
        if: env.NVD_API_KEY != ''
        run: mvn -B org.owasp:dependency-check-maven:check -Dspotless.check.skip=true -DnvdApiKey="$NVD_API_KEY"
      - name: Aviso quando o segredo não está configurado
        if: env.NVD_API_KEY == ''
        run: echo "::warning::NVD_API_KEY não configurado; varredura de vulnerabilidades ignorada."
      - name: Anexar relatório
        if: always() && env.NVD_API_KEY != ''
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check
          path: target/dependency-check-report.html
          if-no-files-found: ignore

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagem (jar em camadas)
        run: docker build -t orbnoc:ci .
      - name: Conferir camadas e usuário não-root
        run: |
          docker run --rm --entrypoint sh orbnoc:ci -c 'test -f orbnoc.jar && test -d lib && test "$(id -u)" != 0'
