name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # "verify" roda os testes unitários (surefire) e os de integração *IT (failsafe), que usam
      # PostgreSQL real via Testcontainers; o runner do GitHub já traz Docker.
      - name: Compilar e testar
        run: mvn -B verify
      - name: Anexar relatório de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: target/site/jacoco
          if-no-files-found: ignore
      - name: Anexar relatórios de teste (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports
            target/failsafe-reports

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagem
        run: docker build -t orbnoc:ci .
