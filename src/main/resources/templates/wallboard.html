<!DOCTYPE html>
<html lang="pt-BR" class="wall" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Wallboard')}"></head>
<body class="wall-body">
<header class="wall-top">
  <div class="wall-brand">
    <img src="/favicon.svg" alt="" width="36" height="36">
    <div>
      <b>Orb<i>NOC</i></b>
      <small>Centro de operações de rede</small>
    </div>
  </div>
  <div class="wall-meta">
    <span class="conn" data-conn>Conectando…</span>
    <div class="wall-clock" aria-live="off">
      <b data-clock="time">--:--:--</b>
      <span data-clock="date"></span>
    </div>
    <div class="wall-actions">
      <button type="button" class="btn btn-outline btn-sm" data-action="fullscreen" title="Atalho: F">Tela cheia</button>
      <a class="btn btn-ghost btn-sm" href="/">Sair</a>
    </div>
  </div>
</header>
<main class="wall-main" id="live-wall" data-fragment="/ui/fragments/wallboard"><th:block th:replace="~{fragments/wallboard :: board}"></th:block></main>
<div th:replace="~{fragments/layout :: toasts}"></div>
</body>
</html>
