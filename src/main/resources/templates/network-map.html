<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mapa de rede')}"></head>
<body>
<header th:replace="~{fragments/layout :: appbar}"></header>
<main class="page">
  <div class="page-head">
    <div><span class="eyebrow"><i class="dot dot-ok"></i> topologia ao vivo</span><h1>Mapa de <span class="accent">rede</span></h1><p class="muted">Arraste para mover, role para ampliar e clique num nó para ver os detalhes.</p></div>
    <div class="actions">
      <span class="conn" data-conn>Conectando…</span>
      <div class="segmented" role="group" aria-label="Layout">
        <a href="/network-map?mode=hierarchical" th:classappend="${mode == 'hierarchical'} ? 'on'">Hierárquico</a>
        <a href="/network-map?mode=radial" th:classappend="${mode == 'radial'} ? 'on'">Radial</a>
        <a href="/network-map?mode=grid" th:classappend="${mode == 'grid'} ? 'on'">Grade</a>
      </div>
    </div>
  </div>
  <section class="card map-card">
    <div id="live-map" data-fragment="/ui/fragments/network-map"><th:block th:replace="~{fragments/network-map :: map}"></th:block></div>
  </section>
</main>
<div th:replace="~{fragments/layout :: toasts}"></div>
</body>
</html>
