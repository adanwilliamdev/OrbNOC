<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mapa de rede')}"></head>
<body>
<header th:replace="~{fragments/layout :: appbar}"></header>
<main class="page">
  <div class="page-head">
    <div><h1>Mapa de rede</h1><p class="page-sub">Arraste para mover, role para ampliar e clique num nó para ver os detalhes.</p></div>
    <div class="actions">
      <div class="zoom-ctl" role="group" aria-label="Zoom do mapa">
        <button type="button" class="icon-btn" data-action="map-zoom-out" aria-label="Afastar" title="Afastar">−</button>
        <button type="button" class="icon-btn" data-action="map-reset" aria-label="Centralizar o mapa" title="Centralizar">◎</button>
        <button type="button" class="icon-btn" data-action="map-zoom-in" aria-label="Aproximar" title="Aproximar">+</button>
      </div>
      <div class="segmented" role="group" aria-label="Layout">
        <a href="/network-map?mode=hierarchical" data-mode-link th:classappend="${mode == 'hierarchical'} ? 'on'">Hierárquico</a>
        <a href="/network-map?mode=radial" data-mode-link th:classappend="${mode == 'radial'} ? 'on'">Radial</a>
        <a href="/network-map?mode=grid" data-mode-link th:classappend="${mode == 'grid'} ? 'on'">Grade</a>
      </div>
    </div>
  </div>

  <section class="card map-card">
    <div id="live-map" data-fragment="/ui/fragments/network-map"><th:block th:replace="~{fragments/network-map :: map}"></th:block></div>
  </section>
</main>
<div th:replace="~{fragments/layout :: toasts}"></div>
</body>
</html>
