[project]
name = "orbnoc-backend"
version = "4.0.0"
description = "OrbNOC: monitoramento de infraestrutura de rede (API + worker)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pwdlib[argon2]>=0.2",
    "pyjwt>=2.9",
    "cryptography>=43",
    "redis>=5.2",
    "httpx>=0.27",
    "icmplib>=3.0.4",
    "dnspython>=2.7",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM"]
ignore = [
    "S101",     # assert nos testes
    "E501",     # o formatter cuida do código; docstrings/SQL longos são aceitáveis
    "ASYNC109", # parâmetro `timeout` é intencional nas sondas de rede
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S104", "S105", "S106", "S311", "S603"]  # 0.0.0.0 é entrada hostil de teste

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]  # SQLAlchemy async roda em greenlets; sem isto a cobertura é subestimada
